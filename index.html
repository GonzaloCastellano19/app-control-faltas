<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Control personal de faltas de asistencia para 2.º de DAM" />
    <meta name="author" content="Gonzalo Castellano Ruiz" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Asistencia DAM</title>
    <script>
      // Aplica el tema guardado antes de pintar, para evitar un destello.
      try {
        var t = localStorage.getItem('asistencia-dam:tema');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
